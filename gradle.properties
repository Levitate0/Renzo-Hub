org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# NOTE: org.gradle.java.home is deliberately NOT set here. Kotlin 2.4's Gradle
# plugin and AGP 8.13 both need a JDK 21 to run under, but pinning an absolute
# path in the project tree breaks every machine that isn't this one — including
# Android Studio on Windows, which supplies its own JDK 21 (JetBrains Runtime).
#
# The Linux build box sets it in ~/.gradle/gradle.properties instead. Android
# Studio picks its JDK from Settings > Build, Execution, Deployment > Build
# Tools > Gradle > Gradle JDK, which should read jbr-21.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Each library module gets its own R containing only its own resources. This is
# what lets :feature-renzo and :feature-shiori keep their original package names
# and their original R references without any source churn.
android.nonTransitiveRClass=true

kotlin.code.style=official
