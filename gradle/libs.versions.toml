# Renzo Hub — single source of truth for every version across the four modules.
#
# The numbers here are the reconciliation of two clients that were on genuinely
# different toolchains: tv-native (AGP 8.13 / Kotlin 2.2 / SDK 36 / Coil 2) and
# the Shiori client (AGP 8.6 / Kotlin 2.4 / SDK 35 / Coil 3). The rule was
# "take the newer of each", with two deliberate exceptions noted below.

[versions]
agp = "8.13.0"
kotlin = "2.4.10"
# Compose Multiplatform — runs the same Compose code on the desktop JVM
# (hub-desktop). Tracks the Google Compose runtime with a small lag; keep in
# step with `composeBom` when bumping either.
composeMultiplatform = "1.10.1"
coroutines = "1.11.0"

compileSdk = "36"
targetSdk = "36"
minSdk = "24"

composeBom = "2026.06.01"
# material-icons-extended was dropped from the Compose BOM, so it is pinned.
materialIcons = "1.7.8"
# tv-material 1.1.0 (stable) rather than tv-native's 1.0.1: 1.0.1 predates this
# BOM by two years and was built against Compose 1.6-era foundation APIs.
tvMaterial = "1.1.0"

activityCompose = "1.10.1"
lifecycle = "2.9.0"
navigationCompose = "2.9.8"
coreKtx = "1.15.0"
documentFile = "1.0.1"
securityCrypto = "1.1.0"
junit = "4.13.2"

# Coil 3.5.0, not the Shiori client's pinned 3.1.0. That pin existed only
# because Coil 3.2+ compiles against SDK 36 and that client was stuck on
# SDK 35 / Gradle 8.7. The Hub is on SDK 36, so the constraint is gone.
coil = "3.5.0"
okhttp = "4.12.0"
retrofit = "3.0.0"
serialization = "1.9.0"

# Media3 held at tv-native's 1.7.1 rather than the current 1.10.x. The player is
# the single most fragile thing being moved and a media3 bump is an independent
# change with its own regression surface — do it on its own branch, not inside
# the merge.
media3 = "1.7.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

junit = { module = "junit:junit", version.ref = "junit" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
